<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract Audio | ToolNova</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <style>
        .tool-container { max-width: 700px; margin: 50px auto; padding: 30px; background: white; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .upload-box { border: 2px dashed var(--border-color); padding: 40px; border-radius: var(--radius-md); cursor: pointer; margin-bottom: 20px; }
        .loading-spinner { display: none; margin: 20px auto; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="tool-container">
            <a href="../../index.html" style="text-decoration: none; color: var(--primary-color); font-weight: 600;">← <span data-i18n="nav_home">Home</span></a>
            <h1 data-i18n="tool_extract_audio">Extract Audio from Video</h1>
            <p>Convert your video files into high-quality MP3 audio tracks.</p>

            <div class="upload-box" id="dropZone">
                <p data-i18n="tool_upload_label">Choose Video File</p>
                <input type="file" id="fileInput" accept="video/*" style="display:none">
            </div>

            <button class="btn btn-primary" id="processBtn" data-i18n="tool_process_btn">Extract Audio</button>

            <div class="loading-spinner" id="spinner"></div>
            <a id="downloadLink" class="btn btn-success" style="display:none; margin-top:20px; text-decoration:none" data-i18n="tool_download_btn">Download MP3</a>
        </div>
    </div>
    <script src="../../js/i18n.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const processBtn = document.getElementById('processBtn');
        const spinner = document.getElementById('spinner');
        const downloadLink = document.getElementById('downloadLink');

        let selectedFile = null;
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => { selectedFile = e.target.files[0]; if(selectedFile) alert('Selected: ' + selectedFile.name); };

        processBtn.onclick = async () => {
            if(!selectedFile) return alert('Please select a video');
            processBtn.style.display = 'none';
            spinner.style.display = 'block';
            downloadLink.style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('http://localhost:8000/api/media/extract-audio', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if(data.download_url) {
                    downloadLink.href = 'http://localhost:8000' + data.download_url;
                    downloadLink.style.display = 'inline-block';
                } else {
                    alert('Error extracting audio');
                }
            } catch (e) {
                alert('Backend error. Make sure server is running and FFmpeg is installed.');
            } finally {
                spinner.style.display = 'none';
                processBtn.style.display = 'inline-block';
            }
        };
    </script>
</body>
</html>
