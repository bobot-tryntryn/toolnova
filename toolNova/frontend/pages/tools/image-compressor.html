<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor | ToolNova</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <style>
        .tool-container { max-width: 700px; margin: 50px auto; padding: 30px; background: white; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .upload-box { border: 2px dashed var(--border-color); padding: 40px; border-radius: var(--radius-md); cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .upload-box:hover { border-color: var(--primary-color); background: #f0f7ff; }
        .options { margin: 20px 0; text-align: left; display: flex; gap: 20px; justify-content: center; align-items: center; }
        .preview-container { display: none; margin-top: 30px; gap: 20px; justify-content: center; }
        .preview-item { text-align: center; }
        .preview-item img { max-width: 200px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="container">
        <div class="tool-container">
            <a href="../../index.html" style="text-decoration: none; color: var(--primary-color); font-weight: 600;">← <span data-i18n="nav_home">Home</span></a>
            <h1 data-i18n="tool_compress_name">Image Compressor</h1>
            <p data-i18n="tool_compress_desc">Reduce image size without visible quality loss.</p>

            <div class="upload-box" id="dropZone">
                <p data-i18n="tool_upload_label">Click or Drag & Drop Image</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none">
            </div>

            <div class="options">
                <label data-i18n="quality">Quality:</label>
                <input type="range" id="qualityRange" min="0.1" max="1.0" step="0.1" value="0.7">
                <span id="qualityValue">70%</span>
            </div>

            <button class="btn btn-primary" id="processBtn" data-i18n="tool_process_btn">Compress Image</button>

            <div class="preview-container" id="previewContainer">
                <div class="preview-item">
                    <p>Original</p>
                    <img id="origImg">
                    <p id="origSize"></p>
                </div>
                <div class="preview-item">
                    <p>Compressed</p>
                    <img id="compImg">
                    <p id="compSize"></p>
                </div>
            </div>
            <button class="btn btn-success" id="downloadBtn" style="display:none; margin-top:20px" data-i18n="tool_download_btn">Download</button>
        </div>
    </div>
    <script src="../../js/i18n.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const qualityRange = document.getElementById('qualityRange');
        const qualityValue = document.getElementById('qualityValue');
        const processBtn = document.getElementById('processBtn');
        const previewContainer = document.getElementById('previewContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalFile = null;

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => { originalFile = e.target.files[0]; if(originalFile) alert('File selected: ' + originalFile.name); };
        qualityRange.oninput = () => { qualityValue.innerText = Math.round(qualityRange.value * 100) + '%'; };

        processBtn.onclick = () => {
            if(!originalFile) return alert('Please select an image');
            const reader = new FileReader();
            reader.readAsDataURL(originalFile);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const compressedData = canvas.toDataURL('image/jpeg', parseFloat(qualityRange.value));

                    document.getElementById('origImg').src = img.src;
                    document.getElementById('compImg').src = compressedData;
                    document.getElementById('origSize').innerText = (originalFile.size / 1024).toFixed(2) + ' KB';

                    previewContainer.style.display = 'flex';
                    downloadBtn.style.display = 'inline-block';

                    downloadBtn.onclick = () => {
                        const link = document.createElement('a');
                        link.download = 'compressed-toolnova.jpg';
                        link.href = compressedData;
                        link.click();
                    };
                };
            };
        };
    </script>
</body>
</html>
